# Shared proxy headers for the klavyn API. X-Forwarded-For is *set*, not
# appended: the server reads the rightmost entry as the one its own proxy
# wrote.
#
# That is only correct once $remote_addr is the real caller rather than the
# Cloudflare edge, which means `deploy/nginx/cloudflare-realip.conf` must be
# installed to /etc/nginx/snippets/ and included from the same server block,
# ahead of the proxying -- see klavyn.conf.example. Not conf.d/: that is
# http level, so it would rewrite $remote_addr for every other site on the
# box. Without that file the server records edge addresses and every client
# behind one edge shares a rate-limit budget.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
