# The gate on every change. Deliberately the same four checks the release
# workflow runs on a tag -- a tag should not be the first time any of them
# runs on CI hardware, which is the cheapest way to waste one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.23.0
  NODE_VERSION: "26"

jobs:
  check:
    name: Tests, format, clippy, audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The desktop crate links against the system webview, so even `cargo
      # test` needs these on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-check-${{ runner.os }}-

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node --test apps/desktop/ui-tests/
      # The firewall script's string handling decides whether the origin is
      # reachable, and three review passes in a row found a parsing bug in it.
      # Too important to depend on someone remembering the manual step.
      - run: bash deploy/tests/cloudflare-origin.test.sh

      # .cargo/audit.toml carries one exemption whose argument depends on the
      # MySQL driver staying unselected, and a note to re-check it on any
      # sqlx upgrade. This is what re-checks it.
      - name: Advisory scan
        run: |
          set -euo pipefail
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo audit
