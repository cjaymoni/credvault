# Shared proxy headers for the klavyn API. X-Forwarded-For is *set*, not
# appended: the server reads the rightmost entry as the one its own proxy
# wrote, and $remote_addr is already the real caller because Cloudflare
# real-IP restoration (conf.d/cloudflare-realip.conf) runs ahead of this.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
