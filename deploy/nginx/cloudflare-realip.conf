# Cloudflare real-IP restoration for nginx. Install to
# /etc/nginx/snippets/cloudflare-realip.conf and `include` it from the klavyn
# server blocks -- see klavyn.conf.example.
#
# NOT conf.d/. Files there are included at http level, so this would rewrite
# $remote_addr for every site on the box. The maintainer's host serves another
# production site; if that one is not behind Cloudflare, or keys allow/deny or
# limit_req on $remote_addr, a box-wide install hands it an attacker-chosen
# address on any request from a Cloudflare range -- and `nginx -t` passes.
# These three directives are valid in server context, so scoping costs
# nothing.
#
# WITHOUT THIS FILE, deploy/nginx/klavyn-proxy.conf IS WRONG. That snippet
# sets X-Forwarded-For to $remote_addr and the server believes the rightmost
# entry, so until real_ip_header has rewritten $remote_addr it forwards the
# Cloudflare *edge* address: everyone behind one edge then shares a
# rate-limit budget -- one password guesser spends it for all of them -- and
# the installation count becomes one per edge per day.
#
# real_ip_recursive is off deliberately. CF-Connecting-IP holds exactly one
# address that Cloudflare wrote itself, so there is no chain to walk; with
# recursion on, a caller-supplied X-Forwarded-For could be walked instead.
#
# set_real_ip_from lists Cloudflare's ranges and nothing else. A 0.0.0.0/0
# here -- the usual copy-paste -- would let anyone reaching the origin
# directly name their own address and country. That is the whole point of the
# list, so narrow the firewall as well: either Cloudflare's ranges only on
# 80/443, or trust nothing here.
#
# Refresh when Cloudflare changes its ranges (weekly from cron is plenty).
# scripts/refresh-cf-ranges.sh prints this whole file -- directives included
# -- having validated every line it fetched. It writes nothing; you redirect,
# install and test, so a bad fetch can never land on a running server:
#
#   scripts/refresh-cf-ranges.sh --nginx > /tmp/realip.conf
#   sudo install -m 644 /tmp/realip.conf /etc/nginx/snippets/cloudflare-realip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do not hand-roll this with `curl | grep '/' | sed`. Two ways that bites:
# a loose pattern accepts `0.0.0.0/0` out of a redirect body or a captive
# portal, which is the exact value this file warns about above; and
# redirecting only the set_real_ip_from lines over this file drops the two
# directives at the bottom, after which nginx reloads cleanly and
# $remote_addr silently goes back to being the Cloudflare edge.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header    CF-Connecting-IP;
real_ip_recursive off;
