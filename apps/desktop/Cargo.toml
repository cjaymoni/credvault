[package]
name = "klavyn-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "klavyn desktop app (macOS, Windows, Linux)"

[lib]
name = "klavyn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
klavyn-core.workspace = true
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-clipboard-manager = "2"
# Opens the Google sign-in page in the system browser rather than in the app
# webview, so credentials are typed into Google's own window.
tauri-plugin-opener = "2"
thiserror.workspace = true
zeroize.workspace = true
# Comparing derived key material without leaking where it differs.
subtle = "2"
sha2.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
