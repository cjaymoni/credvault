# Project name is fixed so volume names are predictable (klavyn_data,
# klavyn_caddy_data) regardless of the directory this is run from.
#
# Renaming this project renames its volumes, so a host that ran the credvault
# stack keeps its data in credvault_data and this one starts empty. Moving it
# across is a one-time step; see "Renaming from credvault" in README.md.
name: klavyn

# klavyn on a single VPS: Caddy terminates TLS, klavyn is reachable only
# on the internal network. Nothing but 80/443 is published to the host.
services:
  klavyn:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: klavyn-server:local
    restart: unless-stopped
    environment:
      # Listen on all interfaces *inside the container*; the container itself
      # publishes no ports, so this is not exposed to the internet.
      KLAVYN_BIND: 0.0.0.0:8787
      KLAVYN_DATA_DIR: /data
      # Rate limits are keyed on the rightmost X-Forwarded-For address, which
      # is the one Caddy appends. Only correct behind the proxy below.
      KLAVYN_TRUST_FORWARDED_FOR: "true"
      # Who may create an account. Three states, and exactly one of them is
      # what this file ships: a token means holders of it, blank means anyone
      # who can reach the server, and KLAVYN_CLOSED_REGISTRATION=true means
      # nobody. The server prints which one it is on every start.
      #
      # Both are passed through, because the way to close registration is to
      # set the second one -- and if it is not listed here it never reaches
      # the container. Setting it in .env then leaves the token blank instead,
      # which is the *open* state: the documented way to shut the door would
      # have opened it. Clap refuses both at once, so a stray pair stops the
      # server rather than guessing.
      KLAVYN_REGISTRATION_TOKEN: ${KLAVYN_REGISTRATION_TOKEN:-}
      KLAVYN_CLOSED_REGISTRATION: ${KLAVYN_CLOSED_REGISTRATION:-}
      # Optional; both blank keeps the server password-only. Clap requires
      # them together, so a lone value stops the server rather than quietly
      # running without the button.
      KLAVYN_GOOGLE_CLIENT_ID: ${KLAVYN_GOOGLE_CLIENT_ID:-}
      KLAVYN_GOOGLE_CLIENT_SECRET: ${KLAVYN_GOOGLE_CLIENT_SECRET:-}
      # Optional, and off when blank: counting how many installations reach
      # this server, on what platform, from what country. Nothing is tied to
      # an account and no address is stored -- see "Counting installations"
      # in the top-level README, and analytics.rs for the whole of it. Setting
      # a key here is a change to what the privacy policy must say.
      KLAVYN_POSTHOG_API_KEY: ${KLAVYN_POSTHOG_API_KEY:-}
      KLAVYN_POSTHOG_HOST: ${KLAVYN_POSTHOG_HOST:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - data:/data
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KLAVYN_DOMAIN: ${KLAVYN_DOMAIN:?set this in .env}
      # The marketing site's apex name. Caddy also answers on www and
      # redirects it here. Required: a blank site address is not valid Caddy
      # config, so the proxy would refuse to start rather than quietly serve
      # nothing.
      KLAVYN_SITE_DOMAIN: ${KLAVYN_SITE_DOMAIN:?set this in .env}
      KLAVYN_ACME_EMAIL: ${KLAVYN_ACME_EMAIL:?set this in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The built static site. Read-only: nothing Caddy serves should be
      # writable by the process serving it.
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [klavyn]
    networks: [internal]

networks:
  internal:

volumes:
  data:
  caddy_data:
  caddy_config:
