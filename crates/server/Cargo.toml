[package]
name = "klavyn-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync and sharing server for klavyn; stores only ciphertext"

[[bin]]
name = "klavyn-server"
path = "src/main.rs"

[dependencies]
klavyn-core.workspace = true
axum = "0.8"
tokio.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
argon2.workspace = true
sha2.workspace = true
subtle = "2"
zeroize.workspace = true
rand.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
# Sign in with Google. webpki roots rather than the system CA store, so the
# container image needs no ca-certificates package.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
jsonwebtoken = "9"
url = "2"

[dev-dependencies]
tempfile = "3"
